name: Deploy

on: 
  push: 
    branches: [main]

permissions: 
  contents: read
  pages: write
  id-token: write

concurrency: 
  group: pages
  cancel-in-progress: false

jobs: 
  test: 
    runs-on: ubuntu-latest
    strategy: 
      fail-fast: false
      matrix: 
        python: ["3.11", "3.12", "3.13"]
    steps: 
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: 
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q 

      
